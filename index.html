<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #0a0c0f; color: white; font-family: sans-serif; }
        #menu, #roomPanel { padding: 20px; text-align: center; }
        #roomPanel { display: none; background: #1a1a2e; }
        button { padding: 10px 20px; margin: 5px; background: #e94560; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>ТАНКИ ДУЭЛЬ</h1>
        <input type="text" id="nicknameInput" placeholder="Введи ник">
        <button id="playBtn">Играть</button>
    </div>
    <div id="roomPanel">
        <p>Панель комнат</p>
        <button>Авто поиск</button>
        <button>Создать комнату</button>
        <button>Назад</button>
    </div>
    <script>
        const playBtn = document.getElementById('playBtn');
        const menu = document.getElementById('menu');
        const roomPanel = document.getElementById('roomPanel');
        playBtn.addEventListener('click', () => {
            const nick = document.getElementById('nicknameInput').value.trim();
            if (!nick) { alert('Введи ник'); return; }
            menu.style.display = 'none';
            roomPanel.style.display = 'block';
        });
    </script>
</body>
</html>
