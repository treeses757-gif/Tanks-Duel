<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanks Duel</title>
    <link rel="stylesheet" href="style.css">
    <!-- Библиотеки -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Наши скрипты -->
    <script src="firebase.js" defer></script>
    <script src="game.js" defer></script>
    <script src="script.js" defer></script>
    <script src="ui.js" defer></script>
</head>
<body>
    <div class="animated-bg"></div>
    <!-- Индикатор соединения -->
    <div id="connectionIndicator" class="indicator" title="Статус соединения"></div>
    
    <div id="gameContainer">
        <!-- Меню (главный экран) -->
        <div id="menu">
            <div class="menu-header">
                <h1>ТАНКИ ДУЭЛЬ</h1>
                <div class="tank-preview" id="tankPreview">
                    <svg viewBox="0 0 100 100">
                        <rect x="30" y="40" width="40" height="30" rx="5" fill="#e94560"/>
                        <circle cx="50" cy="55" r="12" fill="#16213e"/>
                        <rect x="45" y="20" width="10" height="25" fill="#e94560"/>
                    </svg>
                </div>
                <input type="text" id="nicknameInput" class="input-field" placeholder="Введи ник" maxlength="15">
            </div>
            <div class="menu-buttons">
                <button class="menu-btn" id="shopBtn" disabled>Магазин</button>
                <button class="menu-btn" id="tanksBtn" disabled>Танки</button>
                <button class="menu-btn" id="friendsBtn" disabled>Друзья</button>
                <button class="menu-btn" id="playBtn">Играть</button>
            </div>
        </div>

        <!-- Панель комнат (отдельно от меню) -->
        <div id="roomPanel">
            <button class="menu-btn" id="autoSearchBtn">Авто поиск</button>
            <button class="menu-btn" id="createRoomBtn">Создать комнату</button>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="roomCodeInput" class="input-field" placeholder="Код комнаты">
                <button class="menu-btn" id="joinRoomBtn" style="flex: 0 1 auto;">Войти</button>
            </div>
            <div class="status" id="roomStatus"></div>
            <button class="menu-btn" id="backToMenuBtn">Назад</button>
        </div>

        <!-- Холст для игры -->
        <canvas id="gameCanvas" width="800" height="600" class="hidden"></canvas>
    </div>
</body>
</html>
