<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanks Duel (тест)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        #gameCanvas { display: block; width: 800px; height: 600px; margin: 20px auto; border: 2px solid #e94560; }
        #panel { text-align: center; color: white; font-family: Arial; padding: 20px; }
        button { padding: 10px 20px; margin: 5px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; }
        input { padding: 10px; margin: 5px; }
        #log { margin-top: 20px; height: 100px; overflow-y: scroll; background: #0f3460; color: lime; padding: 10px; font-family: monospace; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="panel">
        <h1>Танки: тест мультиплеера</h1>
        <input type="text" id="nickname" placeholder="Ник" value="Игрок">
        <button id="createRoom">Создать комнату</button>
        <button id="autoJoin">Авто поиск</button>
        <div>
            <input type="text" id="roomCode" placeholder="Код комнаты">
            <button id="joinRoom">Войти</button>
        </div>
        <div id="status"></div>
        <div id="log"></div>
    </div>
    <canvas id="gameCanvas" width="800" height="600" style="display: none;"></canvas>

    <script src="game.js"></script>
    <script src="firebase.js"></script>
    <script src="script.js"></script>
</body>
</html>
